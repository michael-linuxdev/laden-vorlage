name: Seiten bauen, prüfen und veröffentlichen

# Läuft bei jedem Push (auch wenn eine Chef-App laeden/<id>/daten/anpassungen.json speichert):
# 1. baut alle Läden mit alle_bauen.py neu (docs/<id>/, dazu docs/index.html als Übersicht)
# 2. testet den Referenz-Laden „saray“ ausführlich (tests/test_seite.py) und alle Läden kurz (tests/rauchtest.py)
# 3. nur auf main: schreibt docs/ zurück ins Repo, erzeugt die Druckvorlagen und veröffentlicht docs/ auf GitHub Pages
#    (Einstellung: Settings → Pages → Source: „GitHub Actions“)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: seite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow (Fotos der Gerichte verkleinern)
        run: pip install pillow==11.0.0

      - name: Alle Läden bauen
        run: python3 alle_bauen.py

      - name: Playwright installieren
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Abläufe testen (Referenz-Laden „saray“ ohne Chef-App-Änderungen)
        run: python3 tests/test_seite.py

      - name: Echte Seite lädt fehlerfrei
        run: python3 tests/test_seite.py --echt

      - name: Alle Läden kurz prüfen (Seite, Bestellung, Küche, Chef-App, Bildschirm)
        run: python3 tests/rauchtest.py

      - name: docs/ ins Repo zurückschreiben
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -I 'class="stand"' -- docs; then
            echo "docs/ ist aktuell"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "docs/ neu gebaut (${GITHUB_SHA::7})"
            git push
          fi

      - name: Schriften für Arabisch und Kyrillisch (Aushang in 6 Sprachen)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: sudo apt-get install -y -qq fonts-noto-core >/dev/null

      - name: Druckvorlagen (Flyer, Aufsteller) als PDF
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          for l in $(ls laeden); do
            [ -f "laeden/$l/laden.py" ] && LADEN=$l python3 druck.py "docs/$l/druck" || echo "Druck $l fehlgeschlagen"
          done

      - name: Pages-Paket hochladen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  veroeffentlichen:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
